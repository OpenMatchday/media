[package]
name = "om_d3_srt_probe"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "OM-004 spike: SRT one-way latency/loss probe (srt-tokio)"

[dependencies]
bytes = "1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
srt-tokio = "0.4.4"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
