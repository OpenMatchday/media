name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify bootstrap files
        run: |
          test -f README.md
          test -f LICENSE
      - name: Media medium gate
        run: python3 gates/media_medium.py
      - name: Install ffmpeg, tesseract, pillow
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg tesseract-ocr tesseract-ocr-eng python3-pil
      - name: One camera preview self-check
        run: python3 gates/one_camera_preview.py
      - name: Two cameras and independent audio self-check
        run: python3 gates/two_cameras_audio.py
      - name: Cut/Take G3 self-check
        run: python3 gates/cut_take.py
      - name: A/V sync G5 self-check
        run: python3 gates/av_sync.py
      - name: Source health + fallback self-check
        run: python3 gates/source_health.py
      - name: Crash preservation self-check
        run: python3 gates/crash_preservation.py
      - name: Output combination G7 self-check
        run: python3 gates/output_combination.py
      - name: Four-corner calibration self-check
        run: python3 gates/calibration.py
      - name: OCR regions + camera-move self-check
        run: python3 gates/ocr_regions.py