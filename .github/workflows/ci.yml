name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify bootstrap files
        run: |
          test -f README.md
          test -f LICENSE
      - name: Media medium gate
        run: python3 gates/media_medium.py
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: One camera preview self-check
        run: python3 gates/one_camera_preview.py
      - name: Two cameras and independent audio self-check
        run: python3 gates/two_cameras_audio.py
      - name: Cut/Take G3 self-check
        run: python3 gates/cut_take.py